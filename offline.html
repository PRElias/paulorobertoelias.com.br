<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Você está offline</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        max-width: 520px;
        background: white;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        text-align: center;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 12px;
      }
      p {
        line-height: 1.6;
        margin-bottom: 20px;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        background: #007bff;
        color: white;
        border-radius: 8px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Você está offline</h1>
      <p>O site está disponível em modo offline, mas a conexão com a internet não está ativa no momento.</p>
      <p>Você pode tentar acessar a página inicial quando a rede voltar ou abrir este site novamente mais tarde.</p>
      <a href="/">Voltar para a página inicial</a>
    </div>
  </body>
</html>
